<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#3584e4"/>
  <circle cx="64" cy="64" r="56" fill="#62a0ea"/>

  <!-- Face outline -->
  <circle cx="64" cy="58" r="32" fill="#f9f7eb" stroke="#c0bfbc" stroke-width="1.5"/>

  <!-- Eyes -->
  <ellipse cx="52" cy="50" rx="5" ry="6" fill="#241f31"/>
  <ellipse cx="76" cy="50" rx="5" ry="6" fill="#241f31"/>
  <!-- Eye highlights -->
  <circle cx="54" cy="48" r="1.5" fill="white"/>
  <circle cx="78" cy="48" r="1.5" fill="white"/>

  <!-- Mouth open -->
  <ellipse cx="64" cy="68" rx="14" ry="10" fill="#241f31"/>

  <!-- Tongue sticking out -->
  <ellipse cx="64" cy="78" rx="10" ry="12" fill="#e01b24"/>
  <ellipse cx="64" cy="76" rx="8" ry="8" fill="#f66151"/>
  <!-- Tongue line -->
  <line x1="64" y1="70" x2="64" y2="86" stroke="#c01c28" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Teeth (upper) -->
  <rect x="54" y="60" width="7" height="5" rx="1.5" fill="white"/>
  <rect x="63" y="60" width="7" height="5" rx="1.5" fill="white"/>

  <!-- Cheeks -->
  <circle cx="40" cy="62" r="5" fill="#f66151" opacity="0.3"/>
  <circle cx="88" cy="62" r="5" fill="#f66151" opacity="0.3"/>

  <!-- Prohibition circle (training symbol) -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="#e5a50a" stroke-width="4" stroke-dasharray="8 4" opacity="0.6"/>
</svg>
