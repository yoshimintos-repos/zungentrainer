<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Upper lip (cupid's bow) -->
  <path d="M 3,7 Q 5,5 8,6.5 Q 11,5 13,7" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Lower lip -->
  <path d="M 3,7 Q 3,10 8,10 Q 13,10 13,7" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Mouth interior -->
  <ellipse cx="8" cy="7.8" rx="3.5" ry="1.8" fill="currentColor" opacity="0.3"/>
  <!-- Tongue sticking out -->
  <path d="M 5.5,8.5 Q 5,12 8,13 Q 11,12 10.5,8.5" fill="currentColor"/>
  <!-- Small checkmark badge -->
  <path d="M 11.5,12 L 12.5,13 L 14.5,10.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
